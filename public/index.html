<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070c18" />
  <title>飞行棋 · 棋盘大屏</title>
  <link rel="stylesheet" href="board.css" />
</head>
<body>
  <div class="bg">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="grid-lines"></div>
  </div>

  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
        </div>
        <div class="brand-text">
          <h1>飞行棋</h1>
          <p>AEROPLANE CHESS · 客厅派对</p>
        </div>
      </div>
      <div class="top-right">
        <div class="room-pill">房间 <b id="roomCode">····</b></div>
        <div class="conn"><span id="connDot" class="conn-dot"></span><span id="connText">连接中</span></div>
      </div>
    </header>

    <main>
      <section class="board-area">
        <div class="turn-banner" id="turnBanner">
          <span class="dot" id="turnDot" style="--c:#8b9bb8"></span>
          <span id="turnText">等待玩家加入</span>
        </div>
        <div class="board" id="board">
          <img class="board-image" src="assets/board-classic.jpg" alt="飞行棋盘" draggable="false" />
          <div id="decor" class="decor"></div>
          <div id="planes" class="planes"></div>
        </div>
        <div class="board-foot">
          <span>掷出 6 起飞</span><i></i>
          <span>落在本色格跳 4 格</span><i></i>
          <span>飞机格飞 12 格</span><i></i>
          <span>撞回对手飞机</span>
        </div>
      </section>

      <aside class="side">
        <section class="card join-card" id="joinCard">
          <div class="card-head">
            <h2 id="joinTitle">手机扫码加入</h2>
            <span class="tag" id="playerCount">0 / 4</span>
          </div>
          <div class="qr-wrap">
            <img id="qrImg" alt="手机扫码加入房间" />
            <div class="qr-empty" id="qrEmpty">正在生成二维码</div>
          </div>
          <div class="join-url" id="joinUrl">正在获取局域网地址…</div>
          <div class="join-compact">
            <span>房间号</span>
            <b id="joinCompactCode">····</b>
            <small>本局进行中 · 结束后大屏可再来一局</small>
          </div>
          <div class="ssl-hint hidden" id="sslHint"></div>
        </section>

        <section class="card rules-card" id="rulesCard">
          <div class="card-head"><h2>玩法设置</h2><span class="tag ghost">开局前</span></div>
          <label class="rule-row">
            <span><b>特殊天气格</b><small>台风随机吹走，雷电劈回停机坪</small></span>
            <input type="checkbox" id="ruleWeather" />
          </label>
          <label class="rule-row">
            <span><b>叠子一起走</b><small>同格的己方飞机会一起移动</small></span>
            <input type="checkbox" id="ruleStack" />
          </label>
          <label class="rule-row">
            <span><b>5 点也能起飞</b><small>掷出 5 或 6 都可以起飞</small></span>
            <input type="checkbox" id="ruleFive" />
          </label>
          <div class="rule-row column">
            <span><b>结束方式</b><small>第一名即结束，或继续排满名次</small></span>
            <div class="seg" id="segEndMode">
              <button type="button" data-value="first">第一名即结束</button>
              <button type="button" data-value="rank">排 1-4 名</button>
            </div>
          </div>
          <div class="rule-row column">
            <span><b>电脑难度</b><small>机器人选棋的聪明程度</small></span>
            <div class="seg" id="segBotLevel">
              <button type="button" data-value="easy">简单</button>
              <button type="button" data-value="normal">普通</button>
              <button type="button" data-value="hard">困难</button>
            </div>
          </div>
        </section>

        <section class="card players-card">
          <div class="card-head"><h2>玩家</h2><span class="tag ghost" id="phaseTag">等待中</span></div>
          <div id="players" class="players"></div>
          <div class="lobby-actions">
            <button id="addBotBtn" class="btn-bot" type="button">加满电脑</button>
            <button id="startBtn" class="btn-start" disabled>开始游戏</button>
          </div>
          <p class="start-hint" id="startHint">至少需要 2 名玩家</p>
        </section>

        <section class="card dice-card">
          <div class="dice-face mini" id="diceBig" data-face="0"></div>
          <div class="dice-copy">
            <div class="dice-label" id="diceLabel">等待开局</div>
            <div class="dice-sub" id="diceSub">扫码后由大屏开始游戏</div>
          </div>
        </section>

        <section class="card log-card">
          <div class="card-head"><h2>对局动态</h2></div>
          <div id="log" class="log"></div>
        </section>
      </aside>
    </main>
  </div>

  <div class="overlay hidden" id="winnerOverlay">
    <div class="winner-card">
      <div class="winner-badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.26L21.5 9.3l-4.75 4.4 1.2 6.55L12 17.1l-5.95 3.15 1.2-6.55L2.5 9.3l6.6-1.04z"/></svg>
      </div>
      <h2 id="winnerName">红队 获胜</h2>
      <p id="winnerSub">四架飞机全部抵达终点</p>
      <div class="winner-ranks hidden" id="winnerRanks"></div>
      <button id="againBtn" class="btn-start">再来一局</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="shared.js"></script>
  <script src="board.js"></script>
</body>
</html>
